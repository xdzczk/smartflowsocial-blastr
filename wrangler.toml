name = "blastr"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV for dedupe (event id)
kv_namespaces = [
  { binding = "PUBLISHED_NOTES", id = "afa24a392a5a41f6b1655507dfd9b97a", preview_id = "0b334aece8d74c3ab90e3e99db569ce8" },
]

# D1 for blastr_* tables (jobs, policy, catalog, etc.)
[[d1_databases]]
binding = "DB"
database_name = "blastr-db"
database_id = "82736a30-841d-4c24-87d8-788763dacb01"

# Single publish queue (create with: wrangler queues create blastr-publish-jobs)
[[queues.producers]]
queue = "blastr-publish-jobs"
binding = "BLASTR_PUBLISH_QUEUE"

[[queues.consumers]]
queue = "blastr-publish-jobs"
max_batch_size = 50
max_batch_timeout = 10
max_retries = 3
visibility_timeout_ms = 30000

[vars]
ENVIRONMENT = "production"

# Optional: routes when deploying to your domain
# routes = [{ pattern = "blastr.smartflow.social/", zone_id = "YOUR_ZONE_ID" }]

[env.staging]
name = "blastr-staging"
kv_namespaces = [
  { binding = "PUBLISHED_NOTES", id = "afa24a392a5a41f6b1655507dfd9b97a", preview_id = "0b334aece8d74c3ab90e3e99db569ce8" },
]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "blastr-db-staging"
database_id = "ba4c227b-edf2-46a4-99fa-4b7bfa036800"
[[env.staging.queues.producers]]
queue = "blastr-publish-jobs"
binding = "BLASTR_PUBLISH_QUEUE"
[[env.staging.queues.consumers]]
queue = "blastr-publish-jobs"
max_batch_size = 50
max_batch_timeout = 10
max_retries = 3
visibility_timeout_ms = 30000
[env.staging.vars]
ENVIRONMENT = "staging"
