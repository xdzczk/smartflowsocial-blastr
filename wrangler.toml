name = "smartflowsocial-blastr"
main = "src/index.ts"
compatibility_date = "2026-03-13"
compatibility_flags = ["nodejs_compat"]

# KV: PUBLISHED_NOTES = dedupe (event id); BLASTR_RATE_LIMIT = rate limits.
# Wrangler 4 provisions these on deploy. Ids stay in the Cloudflare account.
kv_namespaces = [
  { binding = "PUBLISHED_NOTES" },
  { binding = "BLASTR_RATE_LIMIT" },
]

# D1 for blastr_* tables (jobs, policy, catalog, etc.)
[[d1_databases]]
binding = "DB"
database_name = "blastr-db"

# Single publish queue (create with: wrangler queues create blastr-publish-jobs)
[[queues.producers]]
queue = "blastr-publish-jobs"
binding = "BLASTR_PUBLISH_QUEUE"

[[queues.consumers]]
queue = "blastr-publish-jobs"
max_batch_size = 50
max_batch_timeout = 1
max_retries = 3
visibility_timeout_ms = 30000

# NostrMash catalog sync. Outside the publish path.
# Set NOSTRMASH_API_BASE to the origin. Optional BLASTR_RELAY_CATALOG_LIMIT (default 50, max 100).
[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
NOSTRMASH_API_BASE = "https://api.nostrmash.com"

# Optional: routes when deploying to your domain
# routes = [{ pattern = "blastr.smartflow.social/", zone_id = "YOUR_ZONE_ID" }]

[env.staging]
name = "blastr-staging"
kv_namespaces = [
  { binding = "PUBLISHED_NOTES" },
  { binding = "BLASTR_RATE_LIMIT" },
]
[[env.staging.d1_databases]]
binding = "DB"
database_name = "blastr-db-staging"
[[env.staging.queues.producers]]
queue = "blastr-publish-jobs"
binding = "BLASTR_PUBLISH_QUEUE"
[[env.staging.queues.consumers]]
queue = "blastr-publish-jobs"
max_batch_size = 50
max_batch_timeout = 1
max_retries = 3
visibility_timeout_ms = 30000

[env.staging.triggers]
crons = ["*/15 * * * *"]

[env.staging.vars]
ENVIRONMENT = "staging"
NOSTRMASH_API_BASE = "https://api.nostrmash.com"

# Allow queue consumer to fan out to 100+ relays (default 30s is too low).
# Max 300000 (5 min). 3 min is enough for 100+ relays at 8 concurrency.
[limits]
cpu_ms = 180000

[observability]
[observability.logs]
enabled = true
invocation_logs = true
