name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: |
          set +e
          pnpm install --frozen-lockfile > install.log 2>&1
          code=$?
          cat install.log
          exit $code

      - name: Validate formatting, lint and typecheck
        run: |
          set +e
          pnpm validate > validate.log 2>&1
          code=$?
          cat validate.log
          exit $code

      - name: Validate OpenAPI spec
        run: |
          set +e
          pnpm exec -- npx --yes @redocly/cli@latest lint docs/openapi.yaml > openapi.log 2>&1
          code=$?
          cat openapi.log
          exit $code

      - name: Audit dependencies
        run: |
          set +e
          pnpm audit --audit-level=high > audit.log 2>&1
          code=$?
          cat audit.log
          exit $code

      - name: Comment with the failed command output
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = ['install.log', 'validate.log', 'openapi.log', 'audit.log'];
            const parts = [];
            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              const text = fs.readFileSync(file, 'utf8').trim();
              if (!text) continue;
              parts.push(`### ${file}\n\n\`\`\`\n${text.slice(-4000)}\n\`\`\``);
            }
            const body = parts.length
              ? `CI lint-and-typecheck failed.\n\n${parts.join('\n\n')}`
              : 'CI lint-and-typecheck failed before it wrote a log.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65000),
            });

  unit-and-integration-tests:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run security tests
        run: pnpm test:security

  coverage:
    needs: unit-and-integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/
          if-no-files-found: ignore
