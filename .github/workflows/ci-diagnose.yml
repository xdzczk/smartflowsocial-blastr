name: CI diagnose
on:
  push:
    branches: [ci-diagnose]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Format the failing test and raise the undici floor
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.pnpm.overrides.undici = '>=7.30.1';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --write tests/transport/ws/relay.test.ts
      - name: Capture validate and audit
        run: |
          set +e
          pnpm validate > validate.txt 2>&1
          echo "VALIDATE_EXIT:$?" >> validate.txt
          pnpm audit --audit-level=high > audit.txt 2>&1
          echo "AUDIT_EXIT:$?" >> audit.txt
          {
            echo "=== validate ==="
            tail -c 6000 validate.txt
            echo
            echo "=== audit ==="
            tail -c 6000 audit.txt
          } > ci-diagnose.txt
          exit 0
      - name: Publish fix
        run: |
          git config user.name "xdzczk"
          git config user.email "ivmitko@icloud.com"
          git add package.json pnpm-lock.yaml tests/transport/ws/relay.test.ts ci-diagnose.txt
          git commit -m "fix: format relay test and pin undici above the advisory"
          git push
