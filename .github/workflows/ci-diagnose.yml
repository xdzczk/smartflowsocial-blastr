name: CI diagnose
on:
  push:
    branches: [ci-diagnose]
jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record a short summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('ci-diagnose.txt').read_text(errors='replace')
          keep = []
          for line in text.splitlines():
              if any(token in line for token in ('EXIT', 'error', 'Error', 'warning', 'high', 'vulnerab', 'All matched', 'Code style', 'prettier')):
                  keep.append(line[:240])
          Path('diagnose-summary.md').write_text('\n'.join(keep[:80]) + '\n')
          PY
          git config user.name "xdzczk"
          git config user.email "ivmitko@icloud.com"
          git add diagnose-summary.md
          git commit -m "chore: summarize ci diagnose"
          git push
