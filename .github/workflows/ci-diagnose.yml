name: CI diagnose
on:
  push:
    branches: [ci-diagnose]
jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract audit package names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('ci-diagnose.txt').read_text(errors='replace')
          idx = text.rfind('=== audit ===')
          audit = text[idx:] if idx >= 0 else text
          Path('diagnose-summary.md').write_text(audit[-7000:])
          PY
          git config user.name "xdzczk"
          git config user.email "ivmitko@icloud.com"
          git add diagnose-summary.md
          git commit -m "chore: include the audit section"
          git push
